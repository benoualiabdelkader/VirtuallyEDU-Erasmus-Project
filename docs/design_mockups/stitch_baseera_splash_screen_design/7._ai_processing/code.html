<!DOCTYPE html>

<html lang="en"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/><meta content="mobile_blank" name="shell-type"/><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/><link href="https://fonts.googleapis.com" rel="preconnect"/><link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/><link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,600;0,700;1,600&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/><style>@layer base{html,body{width:100vw;margin:0;padding:0;background-color:#ffffff;}body{overscroll-behavior:none;font-family:'Plus Jakarta Sans',sans-serif;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { colors: { "surface-container-low": "#f6f3f2", "on-secondary-fixed": "#1e1b1b", "on-error": "#ffffff", "on-primary-fixed": "#400013", "secondary": "#635d5d", "surface-container-lowest": "#ffffff", "tertiary-fixed-dim": "#90d5ab", "on-surface-variant": "#574144", "on-primary": "#ffffff", "surface-dim": "#dcd9d9", "tertiary": "#003921", "secondary-container": "#e9e0e0", "error": "#ba1a1a", "primary-fixed": "#ffd9dd", "surface-container-high": "#eae7e7", "surface-tint": "#aa304f", "on-error-container": "#93000a", "on-surface": "#1c1b1b", "on-tertiary": "#ffffff", "outline": "#8a7174", "on-secondary-fixed-variant": "#4b4646", "surface": "#ffffff", "secondary-fixed-dim": "#cdc5c5", "primary": "#670024", "primary-container": "#8a1538", "inverse-primary": "#ffb2bd", "on-secondary": "#ffffff", "on-primary-container": "#ff97a8", "on-tertiary-fixed": "#002111", "background": "#ffffff", "on-tertiary-container": "#7fc49b", "on-primary-fixed-variant": "#8a1538", "tertiary-container": "#005232", "inverse-surface": "#313030", "surface-container-highest": "#e5e2e1", "surface-container": "#f0eded", "surface-variant": "#e5e2e1", "tertiary-fixed": "#abf2c6", "primary-fixed-dim": "#ffb2bd", "inverse-on-surface": "#f3f0ef", "error-container": "#ffdad6", "on-background": "#1c1b1b", "outline-variant": "#debfc2", "secondary-fixed": "#e9e0e0", "on-secondary-container": "#696363", "on-tertiary-fixed-variant": "#005232", "surface-bright": "#ffffff" }, borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" }, spacing: { "margin": "1rem", "space-sm": "0.75rem", "space-xs": "0.5rem", "space-md": "1rem", "space-lg": "1.25rem", "gutter": "1rem", "space-xl": "1.5rem" }, fontFamily: { "caption-sm": ["Plus Jakarta Sans"], "headline-md": ["Noto Serif"], "headline-lg": ["Noto Serif"], "body-md-bold": ["Plus Jakarta Sans"], "headline-sm": ["Noto Serif"], "body-md": ["Plus Jakarta Sans"], "body-lg": ["Plus Jakarta Sans"], "caption-lg": ["Plus Jakarta Sans"] }, fontSize: { "caption-sm": ["11px", { lineHeight: "14px", fontWeight: "500" }], "headline-md": ["22px", { lineHeight: "28px", fontWeight: "700" }], "headline-lg": ["24px", { lineHeight: "32px", fontWeight: "700" }], "body-md-bold": ["14px", { lineHeight: "20px", fontWeight: "700" }], "headline-sm": ["20px", { lineHeight: "26px", fontWeight: "700" }], "body-md": ["14px", { lineHeight: "20px", fontWeight: "400" }], "body-lg": ["16px", { lineHeight: "24px", fontWeight: "400" }], "caption-lg": ["12px", { lineHeight: "16px", fontWeight: "500" }] } } } }</script></head><body class="bg-surface text-on-surface min-h-screen flex flex-col antialiased selection:bg-primary-fixed"><main class="flex-1 flex flex-col relative w-full pt-safe pb-safe bg-surface"><div class="flex flex-col w-full px-margin py-space-xl justify-between min-h-[82vh] select-none">
<!-- Top App Context / Quiet Header -->
<div class="w-full flex items-center justify-between pt-space-xs">
<div class="flex items-center gap-space-xs">
<div class="w-2.5 h-2.5 rounded-full bg-primary animate-ping"></div>
<span class="font-caption-lg text-caption-lg uppercase tracking-wider text-primary font-bold">Baseera AI Engine</span>
</div>
<div class="flex items-center gap-1.5 px-space-xs py-0.5 rounded-full bg-surface-container-high">
<span class="material-symbols-outlined text-secondary text-[14px]">lock</span>
<span class="font-caption-sm text-caption-sm text-secondary font-medium">Encrypted Analysis</span>
</div>
</div>
<!-- Center Stage: Ring Loader, Pulsing Core & Status -->
<div class="flex flex-col items-center justify-center my-auto py-space-xl">
<!-- Orbital Pulsing Ring Visual -->
<div class="relative w-36 h-36 flex items-center justify-center mb-space-xl">
<!-- Ambient gentle halo -->
<div class="absolute inset-0 rounded-full bg-primary-fixed opacity-40 blur-xl animate-pulse"></div>
<!-- Rotating Gradient Ring -->
<svg class="w-full h-full animate-spin" style="animation-duration: 2.8s;" viewbox="0 0 120 120">
<defs>
<lineargradient id="maroonGradient" x1="0%" x2="100%" y1="0%" y2="100%">
<stop offset="0%" stop-color="#8A1538" stop-opacity="1"></stop>
<stop offset="60%" stop-color="#8A1538" stop-opacity="0.6"></stop>
<stop offset="100%" stop-color="#F2E9E9" stop-opacity="0.1"></stop>
</lineargradient>
</defs>
<!-- Static track ring -->
<circle cx="60" cy="60" fill="none" r="50" stroke="#F2E9E9" stroke-width="6"></circle>
<!-- Dynamic rotating active gradient arc -->
<circle cx="60" cy="60" fill="none" r="50" stroke="url(#maroonGradient)" stroke-dasharray="210 100" stroke-linecap="round" stroke-width="6"></circle>
</svg>
<!-- Center Pulsing Core & Concentric Accents -->
<div class="absolute inset-0 flex items-center justify-center pointer-events-none">
<div class="w-14 h-14 rounded-full bg-surface-container-low flex items-center justify-center">
<div class="w-8 h-8 rounded-full bg-primary-fixed flex items-center justify-center">
<div class="w-4 h-4 rounded-full bg-primary-container animate-pulse" id="pulseCore"></div>
</div>
</div>
</div>
</div>
<!-- Dynamic Status Messaging -->
<div class="text-center max-w-xs space-y-space-xs px-space-xs">
<h2 class="font-headline-sm text-headline-sm text-on-surface transition-all duration-500 ease-out" id="stageHeading">
        Analyzing language patterns...
      </h2>
<p class="font-caption-lg text-caption-lg text-secondary tracking-normal transition-all duration-500 ease-out" id="stageSubtext">
        Step 2 of 4 • Verifying tone &amp; context
      </p>
</div>
<!-- Precision Progress Bar -->
<div class="w-56 mt-space-lg flex flex-col items-center gap-space-xs">
<div class="w-full h-1.5 rounded-full bg-secondary-container overflow-hidden">
<div class="h-full bg-primary-container rounded-full transition-all duration-700 ease-out" id="analysisProgressBar" style="width: 48%;"></div>
</div>
<div class="w-full flex justify-between items-center text-secondary font-caption-sm text-caption-sm px-0.5">
<span>Synthesizing</span>
<span class="font-bold text-primary" id="percentageBadge">48%</span>
</div>
</div>
</div>
<!-- Bottom Tip Card: Editorial Coaching Touch -->
<div class="w-full">
<div class="w-full rounded-xl bg-surface-container-low p-space-md flex items-start gap-space-sm shadow-sm transition-all duration-300">
<div class="p-space-xs rounded-lg bg-surface-container-highest flex-shrink-0 flex items-center justify-center text-primary-container mt-0.5">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 1;">psychology_alt</span>
</div>
<div class="flex-1 min-w-0">
<div class="font-caption-sm text-caption-sm text-primary font-bold uppercase tracking-wider mb-0.5">
          Critical Mindset
        </div>
<p class="font-body-md text-body-md text-on-surface-variant leading-relaxed">
          Evaluating emotive vocabulary helps uncover underlying framing biases in modern reporting.
        </p>
</div>
</div>
</div>
</div>
<script>
  (function() {
    const steps = [
      { text: "Scanning document architecture...", step: "Step 1 of 4 • Text tokenization", progress: 24 },
      { text: "Analyzing language patterns...", step: "Step 2 of 4 • Verifying tone & context", progress: 48 },
      { text: "Cross-referencing rhetoric models...", step: "Step 3 of 4 • Identifying emotive bias", progress: 78 },
      { text: "Finalizing educational insights...", step: "Step 4 of 4 • Generating coach notes", progress: 96 }
    ];

    let currentStep = 1;
    const headingEl = document.getElementById('stageHeading');
    const subtextEl = document.getElementById('stageSubtext');
    const progressEl = document.getElementById('analysisProgressBar');
    const badgeEl = document.getElementById('percentageBadge');

    setInterval(() => {
      currentStep = (currentStep + 1) % steps.length;
      const target = steps[currentStep];

      if (headingEl && subtextEl && progressEl && badgeEl) {
        headingEl.style.opacity = '0';
        subtextEl.style.opacity = '0';

        setTimeout(() => {
          headingEl.textContent = target.text;
          subtextEl.textContent = target.step;
          progressEl.style.width = target.progress + '%';
          badgeEl.textContent = target.progress + '%';
          headingEl.style.opacity = '1';
          subtextEl.style.opacity = '1';
        }, 250);
      }
    }, 4200);
  })();
</script></main></body></html>
