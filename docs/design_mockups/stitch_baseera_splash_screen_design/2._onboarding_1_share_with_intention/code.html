<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/><style>@layer base{html,body{width:100vw;margin:0;padding:0;background-color:#ffffff;}body{overscroll-behavior:none;font-family:'Plus Jakarta Sans',sans-serif;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { colors: { "surface-container-low": "#f6f3f2", "on-secondary-fixed": "#1e1b1b", "on-error": "#ffffff", "on-primary-fixed": "#400013", "secondary": "#635d5d", "surface-container-lowest": "#ffffff", "tertiary-fixed-dim": "#90d5ab", "on-surface-variant": "#574144", "on-primary": "#ffffff", "surface-dim": "#dcd9d9", "tertiary": "#003921", "secondary-container": "#e9e0e0", "error": "#ba1a1a", "primary-fixed": "#ffd9dd", "surface-container-high": "#eae7e7", "surface-tint": "#aa304f", "on-error-container": "#93000a", "on-surface": "#1c1b1b", "on-tertiary": "#ffffff", "outline": "#8a7174", "on-secondary-fixed-variant": "#4b4646", "surface": "#ffffff", "secondary-fixed-dim": "#cdc5c5", "primary": "#670024", "primary-container": "#8a1538", "inverse-primary": "#ffb2bd", "on-secondary": "#ffffff", "on-primary-container": "#ff97a8", "on-tertiary-fixed": "#002111", "background": "#ffffff", "on-tertiary-container": "#7fc49b", "on-primary-fixed-variant": "#8a1538", "tertiary-container": "#005232", "inverse-surface": "#313030", "surface-container-highest": "#e5e2e1", "surface-container": "#f0eded", "surface-variant": "#e5e2e1", "tertiary-fixed": "#abf2c6", "primary-fixed-dim": "#ffb2bd", "inverse-on-surface": "#f3f0ef", "error-container": "#ffdad6", "on-background": "#1c1b1b", "outline-variant": "#debfc2", "secondary-fixed": "#e9e0e0", "on-secondary-container": "#696363", "on-tertiary-fixed-variant": "#005232", "surface-bright": "#ffffff" }, borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" }, spacing: { "margin": "1rem", "space-sm": "0.75rem", "space-xs": "0.5rem", "space-md": "1rem", "space-lg": "1.25rem", "gutter": "1rem", "space-xl": "1.5rem" }, fontFamily: { "caption-sm": ["Plus Jakarta Sans"], "headline-md": ["Noto Serif"], "headline-lg": ["Noto Serif"], "body-md-bold": ["Plus Jakarta Sans"], "headline-sm": ["Noto Serif"], "body-md": ["Plus Jakarta Sans"], "body-lg": ["Plus Jakarta Sans"], "caption-lg": ["Plus Jakarta Sans"] }, fontSize: { "caption-sm": ["11px", { lineHeight: "14px", fontWeight: "500" }], "headline-md": ["22px", { lineHeight: "28px", fontWeight: "700" }], "headline-lg": ["24px", { lineHeight: "32px", fontWeight: "700" }], "body-md-bold": ["14px", { lineHeight: "20px", fontWeight: "700" }], "headline-sm": ["20px", { lineHeight: "26px", fontWeight: "700" }], "body-md": ["14px", { lineHeight: "20px", fontWeight: "400" }], "body-lg": ["16px", { lineHeight: "24px", fontWeight: "400" }], "caption-lg": ["12px", { lineHeight: "16px", fontWeight: "500" }] } } } }</script></head><body class="bg-surface text-on-surface min-h-screen flex flex-col antialiased selection:bg-primary-fixed"><main class="flex-1 flex flex-col relative w-full pt-safe pb-safe bg-surface"><div class="flex flex-col w-full px-margin justify-between min-h-[calc(100vh-theme(spacing.space-xl))]">
