<!DOCTYPE html>

<html lang="en"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/><meta content="mobile_blank" name="shell-type"/><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/><link href="https://fonts.googleapis.com" rel="preconnect"/><link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/><link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,600;0,700;1,600&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/><style>@layer base{html,body{width:100vw;margin:0;padding:0;background-color:#ffffff;}body{overscroll-behavior:none;font-family:'Plus Jakarta Sans',sans-serif;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { colors: { "surface-container-low": "#f6f3f2", "on-secondary-fixed": "#1e1b1b", "on-error": "#ffffff", "on-primary-fixed": "#400013", "secondary": "#635d5d", "surface-container-lowest": "#ffffff", "tertiary-fixed-dim": "#90d5ab", "on-surface-variant": "#574144", "on-primary": "#ffffff", "surface-dim": "#dcd9d9", "tertiary": "#003921", "secondary-container": "#e9e0e0", "error": "#ba1a1a", "primary-fixed": "#ffd9dd", "surface-container-high": "#eae7e7", "surface-tint": "#aa304f", "on-error-container": "#93000a", "on-surface": "#1c1b1b", "on-tertiary": "#ffffff", "outline": "#8a7174", "on-secondary-fixed-variant": "#4b4646", "surface": "#ffffff", "secondary-fixed-dim": "#cdc5c5", "primary": "#670024", "primary-container": "#8a1538", "inverse-primary": "#ffb2bd", "on-secondary": "#ffffff", "on-primary-container": "#ff97a8", "on-tertiary-fixed": "#002111", "background": "#ffffff", "on-tertiary-container": "#7fc49b", "on-primary-fixed-variant": "#8a1538", "tertiary-container": "#005232", "inverse-surface": "#313030", "surface-container-highest": "#e5e2e1", "surface-container": "#f0eded", "surface-variant": "#e5e2e1", "tertiary-fixed": "#abf2c6", "primary-fixed-dim": "#ffb2bd", "inverse-on-surface": "#f3f0ef", "error-container": "#ffdad6", "on-background": "#1c1b1b", "outline-variant": "#debfc2", "secondary-fixed": "#e9e0e0", "on-secondary-container": "#696363", "on-tertiary-fixed-variant": "#005232", "surface-bright": "#ffffff" }, borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" }, spacing: { "margin": "1rem", "space-sm": "0.75rem", "space-xs": "0.5rem", "space-md": "1rem", "space-lg": "1.25rem", "gutter": "1rem", "space-xl": "1.5rem" }, fontFamily: { "caption-sm": ["Plus Jakarta Sans"], "headline-md": ["Noto Serif"], "headline-lg": ["Noto Serif"], "body-md-bold": ["Plus Jakarta Sans"], "headline-sm": ["Noto Serif"], "body-md": ["Plus Jakarta Sans"], "body-lg": ["Plus Jakarta Sans"], "caption-lg": ["Plus Jakarta Sans"] }, fontSize: { "caption-sm": ["11px", { lineHeight: "14px", fontWeight: "500" }], "headline-md": ["22px", { lineHeight: "28px", fontWeight: "700" }], "headline-lg": ["24px", { lineHeight: "32px", fontWeight: "700" }], "body-md-bold": ["14px", { lineHeight: "20px", fontWeight: "700" }], "headline-sm": ["20px", { lineHeight: "26px", fontWeight: "700" }], "body-md": ["14px", { lineHeight: "20px", fontWeight: "400" }], "body-lg": ["16px", { lineHeight: "24px", fontWeight: "400" }], "caption-lg": ["12px", { lineHeight: "16px", fontWeight: "500" }] } } } }</script></head><body class="bg-surface text-on-surface min-h-screen flex flex-col antialiased selection:bg-primary-fixed"><main class="flex-1 flex flex-col relative w-full pt-safe pb-safe bg-surface"><div class="flex flex-col w-full px-margin pb-space-lg justify-between select-none">
<!-- Top Navigation Bar -->
<div class="flex items-center justify-between w-full h-12">
<button aria-label="Go back" class="flex items-center justify-center w-10 h-10 -ml-2 rounded-full transition-transform active:scale-90 text-on-surface" type="button">
<span class="material-symbols-outlined text-[24px]">chevron_left</span>
</button>
<button class="text-secondary font-body-md text-body-md font-medium px-2 py-1 transition-opacity active:opacity-70" type="button">
      Skip
    </button>
</div>
<!-- Center Presentation: Visual Illustration & Editorial Pitch -->
<div class="flex flex-col items-center justify-center my-auto py-space-md text-center">
<!-- Hero Illustration Canvas -->
<div class="relative w-64 h-64 flex items-center justify-center mb-space-xl">

<div class="absolute inset-2 rounded-full bg-surface-container-low transition-transform duration-700 ease-out"></div>

<img alt="Magnifying glass inspecting digital facts and documents" class="relative z-10 w-52 h-52 object-contain drop-shadow-sm transition-transform duration-500 hover:scale-105" src="https://lh3.googleusercontent.com/aida/AEtjO1WkoxYWuaf09OYfMWt8KIo_MKPJTtLRR8geDkK2nCWtz_qhb-1jXP4Ve7QJ9u5kIUpVKW6ZK5y0OJz4tWr4_88PX81pXCqKbcbu9nS47n9lSRx5UEPIQerEFdFQXo2N1lQGrBi1FKsR_IEKSCcxWxaodZU3_xgqDOEURsavKz9phvMq_8BRuh_nBOiMv5_nwHUvfMWnjyN2a3ZIEBoXuLfjQi-tO2xJ2DxkB2gX6l-Ia0IysC0841Jq"/>
<!-- Subtle sparkle accent detail -->
<div class="absolute -top-1 -right-1 w-7 h-7 rounded-full bg-primary-fixed flex items-center justify-center">
<span class="material-symbols-outlined text-primary text-[16px]" style="font-variation-settings: 'FILL' 1;">auto_awesome</span>
</div>
</div>
<!-- Editorial Text Block -->
<div class="flex flex-col items-center max-w-xs space-y-space-xs">
<h1 class="font-headline-md text-headline-md text-on-surface tracking-tight">
        AI-Powered Fact Checking
      </h1>
<p class="font-body-md text-body-md text-secondary leading-relaxed">
        Harness intelligent analysis to unpack biases, detect anomalies, and verify sources instantly.
      </p>
</div>
</div>
<!-- Bottom Interactive Section: Indicators & Primary Navigation -->
<div class="flex flex-col items-center w-full space-y-space-lg">
<!-- Pagination Indicator (Step 2 of 3) -->
<div aria-label="Onboarding Progress" class="flex items-center justify-center space-x-2" role="tablist">
<!-- Dot 1 -->
<span aria-label="Step 1" class="w-2 h-2 rounded-full bg-secondary-container transition-all"></span>
<!-- Dot 2 (Active Pill) -->
<span aria-label="Step 2 of 3 (Current)" class="w-6 h-2 rounded-full bg-primary-container transition-all duration-300"></span>
<!-- Dot 3 -->
<span aria-label="Step 3" class="w-2 h-2 rounded-full bg-secondary-container transition-all"></span>
</div>
<!-- Action Button -->
<button class="w-full h-14 bg-primary-container text-on-primary font-body-md-bold text-body-lg rounded-2xl flex items-center justify-center space-x-2 shadow-sm active:opacity-90 active:scale-[0.99] transition-all" type="button">
<span>Next</span>
<span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</div>
</div></main></body></html>
