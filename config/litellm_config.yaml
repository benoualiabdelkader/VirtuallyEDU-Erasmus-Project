# LiteLLM Proxy Configuration for VirtuallyEDU Baseera Platform
# Usage:
#   pip install litellm
#   litellm --config config/litellm_config.yaml --port 4000
#
# Client configuration (.env):
#   VITE_AI_BASE_URL=http://localhost:4000/v1
#   VITE_AI_MODEL=baseera-default

model_list:
  - model_name: baseera-default
    litellm_params:
      model: groq/qwen/qwen3.8-27b
      api_key: os.environ/GROQ_API_KEY
      temperature: 0.7
      max_tokens: 900

  - model_name: baseera-vision
    litellm_params:
      model: groq/qwen/qwen3.8-27b
      api_key: os.environ/GROQ_API_KEY
      temperature: 0.5
      max_tokens: 1000

  - model_name: baseera-fallback
    litellm_params:
      model: groq/openai/gpt-oss-120b
      api_key: os.environ/GROQ_API_KEY
      temperature: 0.7

litellm_settings:
  drop_params: true
  set_verbose: false
  telemetry: false
