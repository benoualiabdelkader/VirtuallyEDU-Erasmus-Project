name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    name: Lint, Test & Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: baseera

    env:
      VITE_AI_API_KEY: ci-test-key
      VITE_GROQ_API_KEY: ci-test-key
      VITE_AI_BASE_URL: https://api.groq.com/openai/v1
      VITE_AI_MODEL: qwen/qwen3.8-27b

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: baseera/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Static Analysis (oxlint)
        run: npm run lint

      - name: Type Check (tsc)
        run: npx tsc -b

      - name: Test Suite (vitest)
        run: npm test

      - name: Production Build
        run: npm run build
